<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal QA &lt;script&gt;test&lt;/script&gt;</title><style>*{box-sizing:border-box}body{margin:0;background:#16261e;font-family:system-ui,sans-serif}.slide{display:none;min-height:calc(100dvh - 75px);padding:7vh 9vw;overflow-wrap:anywhere}.active{display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(30px,5vw,68px);margin:20px 0}p{white-space:pre-wrap;font-size:clamp(20px,2.4vw,36px);line-height:1.6;margin:0}small{letter-spacing:.2em}nav{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px;color:white}button{padding:12px 25px;border:0;border-radius:8px;font:inherit}button:focus-visible{outline:3px solid orange}button:disabled{opacity:.4}@media print{.slide{display:block;height:100vh;break-after:page}nav{display:none}}</style><section class="slide active" style="background:#e8f1ec;color:#17382f"><small>SMARTACTION</small><h1>Portal QA &lt;script&gt;test&lt;/script&gt;</h1><p>Prefixed deployment test
第二行</p></section><nav><button id="prev">Previous</button><output id="count"></output><button id="next">Next</button></nav><script>(()=>{let n=0;const s=[...document.querySelectorAll('.slide')],p=document.getElementById('prev'),q=document.getElementById('next'),c=document.getElementById('count');function go(i){n=Math.max(0,Math.min(s.length-1,i));s.forEach((e,k)=>e.classList.toggle('active',k===n));p.disabled=n===0;q.disabled=n===s.length-1;c.textContent=(n+1)+' / '+s.length;}p.onclick=()=>go(n-1);q.onclick=()=>go(n+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(n+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(n-1);}});go(0);})();</script></html>
